<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topo">

        <h1>Catálogo de Filmes</h1>

        <div class="barra-pesquisa">

            <input type="text" placeholder="Pesquisar filmes...">

            <button>🔍</button>

        </div>

    </header>

    <section class="categoria-filmes">

        <h2>Filmes de Comédia</h2>

        <div class="cards-filmes">

            <div class="card-filme">
                <img src="https://picsum.photos/300/400?random=1">
                <h3>As Branquelas</h3>
                <p>Comédia</p>
            </div>

            <div class="card-filme">
                <img src="https://picsum.photos/300/400?random=2">
                <h3>Gente Grande</h3>
                <p>Comédia</p>
            </div>

            <div class="card-filme">
                <img src="https://picsum.photos/300/400?random=3">
                <h3>Todo Mundo em Pânico</h3>
                <p>Comédia</p>
            </div>

            <div class="card-filme">
                <img src="https://picsum.photos/300/400?random=4">
                <h3>Click</h3>
                <p>Comédia</p>
            </div>

        </div>

    </section>

</body>

</html>
